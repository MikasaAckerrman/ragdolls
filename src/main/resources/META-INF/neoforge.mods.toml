[[mods]]
modId = "ragdolls"
version = "1.0.0"
displayName = "Ragdolls"
authors = "Slayer"
description = '''
Physics-based ragdoll corpses for all living entities, including modded mobs.
On death an entity collapses into a single, glued-together rigid ragdoll that
tumbles and is thrown according to the direction and power of the killing blow.
'''

