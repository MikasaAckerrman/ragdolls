plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = project.mod_version
group = project.mod_group

base {
    archivesName = project.mod_id
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

neoForge {
    version = project.neoforge_version

    // Local test environment (run from an IDE or `./gradlew runClient` / `runServer`).
    // Essential for iterating on render/mixin work, which can only be verified in-game.
    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    // Register the mod so resources (neoforge.mods.toml) are validated against it.
    mods {
        "${project.mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
